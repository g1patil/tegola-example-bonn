<!DOCTYPE html>
<html>
<head>
    <title>Tegola Sample - MapLibre</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- MapLibre GL JS -->
    <script src="https://unpkg.com/maplibre-gl@4.1.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@4.1.2/dist/maplibre-gl.css" rel="stylesheet" />

    <style>
        body {
            margin: 0;
            padding: 0;
        }
        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>
<div id="map"></div>

<script>
    const map = new maplibregl.Map({
        container: 'map',
        // Base layer style (light background map)
        style: 'https://tiles.basemaps.cartocdn.com/gl/positron-gl-style/style.json',
        center: [7.0982, 50.7374], // Bonn, Germany [longitude, latitude]
        zoom: 14
    });

    // Add navigation controls
    map.addControl(new maplibregl.NavigationControl(), 'top-right');

    map.on('load', () => {
        // Add your Tegola vector tile source
        map.addSource('tegola', {
            type: 'vector',
            tiles: ['http://localhost:8081/maps/bonn/{z}/{x}/{y}.vector.pbf'],
            minzoom: 5,
            maxzoom: 20
        });

        // Add lakes layer
        map.addLayer({
            id: 'lakes',
            type: 'fill',
            source: 'tegola',
            'source-layer': 'lakes',
            paint: {
                'fill-color': '#00ccff',
                'fill-opacity': 0.5
            }
        });

        // Add main roads layer
        map.addLayer({
            id: 'main-roads',
            type: 'line',
            source: 'tegola',
            'source-layer': 'main_roads',
            paint: {
                'line-color': '#ff6600',
                'line-width': 3
            }
        });

        // Add roads layer
        map.addLayer({
            id: 'roads',
            type: 'line',
            source: 'tegola',
            'source-layer': 'road',
            paint: {
                'line-color': '#666666',
                'line-width': 1
            }
        });

        map.addLayer({
            'id': 'restaurants-layer',
            'type': 'circle',
            'source': 'tegola',
            'source-layer': 'restaurants',
            'paint': {
                'circle-color': '#002aff',    // ← YOU choose red
                'circle-radius': 8,            // ← YOU choose size
                'circle-stroke-width': 2,      // ← YOU choose border
                'circle-stroke-color': '#fff'  // ← YOU choose white border
            }
        });

        console.log('Map loaded successfully!');
    });

    map.on('error', (e) => {
        console.error('Map error:', e);
    });
</script>
</body>
</html>
